name: CI

# Every pull request and every push to main builds the plugin and runs its tests. The plugin is built against the Kyuplan.Plugins.Abstractions
# project of the Kyuplan repository, which is checked out next to it (see KyuplanRoot in Directory.Build.props).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kyuplan.plugins.spond

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArizonaGreenTea05/kyuplan
          path: Kyuplan

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: kyuplan.plugins.spond
        run: dotnet test Kyuplan.Plugins.Spond.sln -c Release

      - name: Package
        working-directory: kyuplan.plugins.spond
        run: |
          dotnet publish src/Kyuplan.Plugins.Spond -c Release -o publish
          (cd publish && zip -qr ../spond.kyuplugin .)
          unzip -l spond.kyuplugin
